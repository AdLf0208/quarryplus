[package]
# Port of QuarryPlus 21.1.165 (Kotori316/QuarryPlus, LGPL-3.0-only). Minecraft Java
# 1.21.1 NeoForge; the port targets Horizon 26.3 at the SDK build horizon-mod.toml
# pins. Clean-room Rust rewrite from the mod's behaviour (FINDINGS.md), local-only
# until publishing is approved, publishable under the same licence with this source.
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "quarryplus"
version = "0.2.0"
edition = "2024"
license = "LGPL-3.0-only"
description = "QuarryPlus for Horizon: the Quarry machine and its carried content"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build). Any other registry dependency must be
# pinned with `horizon-launcher native-lock .` before building.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
